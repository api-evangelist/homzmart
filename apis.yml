name: Homzmart
description: >-
  Homzmart is a Cairo, Egypt-based online marketplace for furniture, home decor,
  appliances, and workspace products that connects thousands of local
  manufacturers, brands, and merchants with consumers across Egypt and the wider
  MENA region. Founded in 2019 by Mahmoud Ibrahim and Ibrahim Mohamed, the
  platform lists more than 55,000 products and layers in flexible financing,
  delivery, and assembly services. Homzmart runs consumer web and mobile
  storefronts alongside merchant-facing "Sell With Us" and "Homzmart For
  Business" programs, and has raised roughly $40M in venture funding including a
  $15M Series A, with 500 Global among its backers. No public developer API
  program, SDK, or API documentation was found during enrichment; the company
  publishes a vulnerability-disclosure page and standard trust/policy pages.
